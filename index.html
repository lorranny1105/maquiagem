<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz da Maquiagem 💄</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <h1>💄 Quiz da Maquiagem</h1>

        <!-- TELA INICIAL -->
        <section class="tela-inicial">

            <h2>Bem-vindo ao Quiz!</h2>

            <p>
                Teste seus conhecimentos sobre maquiagem,
                produtos de beleza e cuidados com a pele.
            </p>

            <p>
                Responda às perguntas e descubra
                quantos pontos você consegue fazer! ✨
            </p>

            <button class="iniciar-btn">
                Começar Quiz
            </button>

        </section>

        <!-- PERGUNTA -->
        <section class="quiz">

            <div class="caixa-perguntas"></div>

            <div class="caixa-alternativas"></div>

        </section>

        <!-- RESULTADO -->
        <section class="caixa-resultado">

            <h2>🎉 Resultado!</h2>

            <p class="texto-resultado"></p>

            <button class="novamente-btn">
                Jogar novamente
            </button>

        </section>

    </main>

    <script type="module" src="js/script.js"></script>

</body>

</html>
